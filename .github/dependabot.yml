# Keeps the pinned action SHAs and the npm dependencies current (D-16).
# Each ecosystem gets one grouped pull request a month, and Dependabot never
# rebases it on its own, so update pull requests do not pile up.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      npm:
        patterns: ["*"]
  # The Firebase CLI of the deploy jobs lives in its own npm project (D-53).
  - package-ecosystem: npm
    directory: /deploy
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      deploy:
        patterns: ["*"]
