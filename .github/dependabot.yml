# Keeps the pinned action SHAs current (D-16). Each ecosystem gets one
# grouped pull request a month, and Dependabot never rebases it on its own,
# so update pull requests do not pile up. The npm ecosystem joins this file
# with the stack pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ["*"]
