name: deploy

# Deploys main to the live channel of natekramber-prod (D-35, D-63, G-10). Each
# push to main deploys, and the owner can also run it by hand on main (D-84).
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A deploy in progress always finishes, and the newest
# commit deploys next.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

# Every action is pinned to a commit SHA, and the comment names its tag.
# verified_at: 2026-09-14 for download-artifact, 2026-09-13 for the rest, sources:
#   https://api.github.com/repos/actions/checkout/git/ref/tags/v7.0.1
#   https://api.github.com/repos/actions/setup-node/git/ref/tags/v7.0.0
#   https://api.github.com/repos/actions/upload-artifact/git/ref/tags/v7.0.1
#   https://api.github.com/repos/actions/download-artifact/git/ref/tags/v8.0.1
#   https://api.github.com/repos/google-github-actions/auth/git/ref/tags/v3.0.0
#
# The Workload Identity Federation setup of docs/deploy.md. D-78 permits the
# project number and the service account address in this file.
env:
  LIVE_PROJECT: natekramber-prod
  WIF_PROVIDER: projects/321332406577/locations/global/workloadIdentityPools/github/providers/portfolio-production
  SERVICE_ACCOUNT: hosting-live@natekramber-prod.iam.gserviceaccount.com
  # The default domain of the site always serves the live channel, before and
  # after the custom domain. Firebase overwrites HSTS there (D-59).
  LIVE_DEFAULT_URL: https://natekramber-prod.web.app

jobs:
  build:
    name: "deploy:build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: install
        run: make install
      - name: build
        run: make build
      # The build runs in this job, which holds no id-token.
      - name: keep the build for the deploy job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  live:
    name: "deploy:live"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment accepts main alone. Its OIDC subject is the one subject
    # that the provider of natekramber-prod trusts (D-63).
    environment:
      name: production
      url: https://natekramber.com
    # id-token: write lets the auth action get a GitHub OIDC token for Workload
    # Identity Federation, with no key (D-35, G-9).
    permissions:
      contents: read
      id-token: write
    steps:
      # The checkout gives firebase.json, the lockfile of deploy/, and the header check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: deploy/package-lock.json
      - name: get the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # The install runs before the credentials exist (D-53).
      - name: install the Firebase CLI
        run: npm ci --prefix deploy --no-audit --no-fund
      - name: authenticate with no key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      # A Hosting deploy releases to the live channel at once. The JSON output
      # names the new version, which a rollback can release again (docs/deploy.md).
      - name: deploy to the live channel
        env:
          MESSAGE: ${{ github.event_name }} of ${{ github.sha }}, run ${{ github.run_id }}
        run: |
          if ! npm exec --prefix deploy -- firebase deploy --only hosting \
            --project "$LIVE_PROJECT" --message "$MESSAGE" --json > deploy.json; then
            cat deploy.json
            exit 1
          fi
          cat deploy.json
      - name: the live site sends the headers of firebase.json
        run: node scripts/check-preview-headers.mjs "$LIVE_DEFAULT_URL"
